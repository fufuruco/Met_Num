services:
  - type: web
    name: numlab
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    disk:
      name: numlab-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DIR
        value: /var/data
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
