<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        var path = window.location.pathname;
        var isGitHubPagesRoot = window.location.hostname === 'fufuruco.github.io' &&
          (path === '/Met_Num' || path === '/Met_Num/');
        if (isGitHubPagesRoot && !window.location.hash) {
          window.location.replace(window.location.pathname.replace(/\/$/, '') + '/#/');
          return;
        }
        if ((path.endsWith('/reset-password') || path.endsWith('/reset-password/')) && !window.location.hash) {
          var search = window.location.search;
          var cleanPath = path.replace(/\/reset-password\/?$/, '');
          window.location.replace(window.location.origin + cleanPath + '/#/reset-password' + search);
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="apple-touch-icon" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NumLab - Laboratorio virtual de Métodos Numéricos para estudiantes de ingeniería" />
    <meta name="theme-color" content="#4f46e5" />
    <title>NumLab - Métodos Numéricos</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
